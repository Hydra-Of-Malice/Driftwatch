# Semantic data contract: PayFlux public API reference.
source_id: payflux-docs
version: 1
entity_key: path

schema:
  type: object
  required: [page_title, endpoints]
  properties:
    page_title: { type: string }
    api_version: { type: [string, "null"] }
    endpoints:
      type: array
      minItems: 1
      items:
        type: object
        required: [path, method, required_params, deprecated, rate_limit]
        properties:
          path: { type: string }
          method: { type: string }
          required_params: { type: array, items: { type: string } }
          optional_params: { type: array, items: { type: string } }
          deprecated: { type: boolean }
          rate_limit: { type: [string, "null"] }
          auth: { type: [string, "null"] }

invariants:
  - { field: "endpoints[].method", kind: enum, values: [GET, POST, PUT, PATCH, DELETE] }
  - { field: "endpoints[].required_params", kind: non_null }
  - { field: "endpoints", kind: cardinality_drop, max_drop_pct: 50 }

assertions:
  - field: "endpoints[].rate_limit"
    meaning: "request rate limit expressed per MINUTE"
    unit_context_field: "endpoints[].rate_limit"
    anchors: ["per minute"]

continuity:
  - { field: "endpoints", max_cardinality_drop_pct: 50 }

significant_fields:
  - "endpoints[].required_params"
  - "endpoints[].deprecated"
  - "endpoints[].rate_limit"
  - "endpoints[].auth"
  - "endpoints[].method"
