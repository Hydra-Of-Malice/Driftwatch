[project]
name = "driftwatch-engine"
version = "0.1.0"
description = "Driftwatch engine: self-healing web-data pipelines with semantic contracts, drift taxonomy and verified repair (Bright Data Scraper Studio orchestration)."
requires-python = ">=3.10"
# Zero mandatory third-party deps beyond what ships in most distros / CI:
# flask, pydantic>=2, jsonschema, pyyaml, httpx. sqlite3/unittest are stdlib.
dependencies = [
  "flask>=3",
  "pydantic>=2",
  "jsonschema>=4",
  "pyyaml>=6",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
