services:
  - type: web
    name: driftwatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: DW_MODE
        value: replay
      - key: DW_API_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DW_SLACK_WEBHOOK
        sync: false
