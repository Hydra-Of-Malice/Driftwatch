name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install flask "pydantic>=2" jsonschema pyyaml httpx ruff
      - name: Lint
        run: ruff check backend
      - name: Tests (contracts, drift, healing, E2E mirror-break, API)
        run: cd backend && python -m unittest discover -s tests -v
