name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    # windows-latest is not optional. Every Windows bug this project has shipped
    # (the hardcoded POSIX PATH in brightdata/live.py, the bare `brightdata`
    # invocation that CreateProcess cannot resolve to the npm `.cmd` shim) got
    # through review and shipped undetected because CI was Linux-only. The
    # project is developed on Windows; CI has to run there too.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Single source of truth: requirements.txt. ruff is dev-only, so it is
        # the one package installed outside it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check backend
      - name: Tests (contracts, drift, healing, E2E mirror-break, API)
        run: python -m unittest discover -s tests -v
        working-directory: backend
