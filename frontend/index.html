<!doctype html>
<html lang="en" data-theme="spider">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driftwatch — the missing changelog for the web you depend on</title>
  <meta name="description" content="Driftwatch turns the public pages your stack silently depends on — model pricing, API docs, rate limits, vendor terms — into versioned, validated data contracts that repair themselves when sites change, built on Bright Data Scraper Studio." />
  <meta property="og:title" content="Driftwatch — the missing changelog for the web you depend on" />
  <meta property="og:description" content="Self-healing, semantically validated monitoring for the pages your stack silently depends on. Built on Bright Data Scraper Studio for the WeMakeDevs × Bright Data hackathon." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Driftwatch — the missing changelog for the web you depend on" />
  <meta name="twitter:description" content="Self-healing, semantically validated monitoring for the pages your stack silently depends on." />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%233987e5' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='%23d03b3b'/></svg>" />
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Primary">
      <a class="wordmark" href="#/web">
        <span class="wordmark-dot" aria-hidden="true"></span>DRIFTWATCH
      </a>
      <!-- Provenance badge. Resolved from GET /api/meta at load; never hardcoded,
           so a viewer can never mistake the deterministic replay world for a live
           Bright Data session. -->
      <div id="mode-badge" class="mode-badge mode-unknown" role="status" aria-live="polite"
           title="Resolving data source from /api/meta…">
        <span class="mode-dot" aria-hidden="true"></span><span class="mode-text">checking…</span>
      </div>
      <a href="#/web" data-nav="web"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="2.2" r="1.1" fill="currentColor" stroke="none"/><circle cx="2.6" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.4" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><path d="M8 3.3v3.1M7.1 8.9L3.3 10.7M8.9 8.9l3.8 1.8"/></svg></span>Web</a>
      <a href="#/sources" data-nav="sources"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2 L14 5.2 L8 8.4 L2 5.2 Z"/><path d="M2 8.2 L8 11.4 L14 8.2"/><path d="M2 11.2 L8 14.4 L14 11.2"/></svg></span>Sources</a>
      <a href="#/events" data-nav="events"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M1.5 8.5 H5 L6.5 3.5 L9.5 13 L11 8.5 H14.5"/></svg></span>Events</a>
      <a href="#/heal" data-nav="heal"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 1.5 L13.5 3.5 V7.8 C13.5 11.3 11.2 13.6 8 14.5 C4.8 13.6 2.5 11.3 2.5 7.8 V3.5 Z"/><path d="M5.7 8.2 L7.2 9.7 L10.5 6.2"/></svg></span>Heal Center</a>
      <a href="#/ledger" data-nav="ledger"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 2 H13 V13.5 L11 12 L9 13.5 L7 12 L5 13.5 L3 12 Z"/><path d="M5.5 5.5 H10.5 M5.5 8 H10.5 M5.5 10.5 H8.5"/></svg></span>Ledger</a>
      <div class="rail-foot">
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button type="button" data-theme-set="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A6 6 0 1 1 6.5 2.5 A5 5 0 0 0 13.5 9.5Z" fill="currentColor" stroke="none"/></svg></button>
          <button type="button" data-theme-set="spider" title="Spider Mode" aria-label="Spider theme"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="9" rx="2.2" ry="2.8" fill="currentColor" stroke="none"/><circle cx="8" cy="5.3" r="1.3" fill="currentColor" stroke="none"/><path d="M6 7 L1.5 5 M6 8.5 L1 8.5 M6 10 L1.5 11.5 M10 7 L14.5 5 M10 8.5 L15 8.5 M10 10 L14.5 11.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
        <button id="demo-toggle" class="ghost-btn" type="button">Demo controls</button>
        <div class="rail-note">Scraper Studio<br/>orchestration: <span id="mode-chip">replay</span></div>
      </div>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <aside id="demo-drawer" class="demo-drawer" hidden aria-label="Demo controls"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
